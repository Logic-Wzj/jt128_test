# ============================================================================
# NDT 重定位参数 —— Mid-360 + fzsd 实车栈（hdl_localization 路线的 A 方案）
#
# 节点：pcl_localization_ros2 / pcl_localization_node  (package 名与仓库名不同)
# 作用：订阅点云 + 先验 PCD，配准出 map->base，再换算广播 map->odom
#       —— 与 small_gicp_relocalization 的对外契约完全一致，可直接互换做 A/B。
#
# 注意两个从源码读出来的坑（已在 launch 里处理，别自己删）：
#   1. 节点订阅的话题是 **velodyne_points**（不是 /cloud！上游 launch 里的
#      remap /cloud:=/velodyne_points 其实是空操作）。所以 launch 必须写
#      velodyne_points:=/livox/lidar_base。
#   2. 节点**不做雷达外参补偿**：它把收到的点云当成已经在 base_frame 里，
#      直接把配准结果当 map->base 发。Mid-360 装在云台上、还有 -45° roll，
#      所以必须先由 cloud_to_base.py 把点云转到 base_footprint 再喂进来，
#      否则算出来的位姿会带着 -45° 的倾斜，nav2 会整体歪掉。
# ============================================================================
/**:
  ros__parameters:
    # ---------- 坐标系：必须和 fzsd 实车栈一致 ----------
    global_frame_id: "map"
    odom_frame_id: "odom"          # 由 loam_interface / point_lio 提供 odom->base
    base_frame_id: "base_footprint"

    # ---------- NDT 配准 ----------
    registration_method: "NDT_OMP" # 我们对比的就是这个（另一条路是 small_gicp）
    ndt_resolution: 1.0            # 室外大场景 1.0 m 够用；室内复杂可降到 0.5
    ndt_step_size: 0.1
    ndt_num_threads: 4            # 实测：本节点源码没 declare 这个参数，写 4 读进来还是 0
                                  # （0 => setNumThreads(omp_get_max_threads())，用满所有核，不影响结果）
    transform_epsilon: 0.01
    score_threshold: 2.0           # 只用于打 WARN，不参与解算（源码确认）
    voxel_leaf_size: 0.2           # 体素降采样，直接决定单帧耗时
    scan_min_range: 1.0            # 车体自身遮挡
    scan_max_range: 60.0           # Mid-360 10% 反射率只有 40 m，60 足够
    scan_period: 0.02              # /livox/lidar 是 50 Hz => 0.02 s

    # ---------- 先验地图 ----------
    use_pcd_map: true
    map_path: "/home/wzj/fzsd2025/install/pb2025_nav_bringup/share/pb2025_nav_bringup/pcd/reality/rmul_2025.pcd"
    # 2.55M 点、带 normal/curvature 字段；节点按 PointXYZI 读，PCL 只取前 4 个字段，没问题。

    # ---------- 初始位姿 ----------
    # false = 等 /initialpose（RViz 的 2D Pose Estimate）。
    # 这样两边（GICP 与 NDT）拿到的是**同一个初始位姿**，A/B 才公平。
    # 想改成写死，就把 set_initial_pose 设 true 并填下面 7 个数（qw 必须是 1 不是 0！）
    set_initial_pose: false
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0

    # ---------- 其它 ----------
    use_odom: false                # NDT 每帧独立配准，50 Hz 下够快；开了要用 twist 做角度预测
    use_imu: false                 # true 会去做运动畸变补偿（需要 /imu 且时间戳对得上）
    enable_debug: false

    # ---------- 本地补丁：发 map->odom 而不是 map->base ----------
    # true  = 广播 map->odom（nav2 / REP-105 期望，和 GICP 一样）
    #         实现：T_map_odom = T_map_base * (T_odom_base)^-1
    # false = 退回上游行为，直接广播 map->base（会和 LIO 的 odom->base 打架）
    publish_map_to_odom: true
