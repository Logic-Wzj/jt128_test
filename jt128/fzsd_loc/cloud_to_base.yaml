# cloud_to_base 中继参数：把雷达点云从传感器坐标系搬到 base_footprint
/cloud_to_base:
  ros__parameters:
    input_topic: "/livox/lidar"          # 驱动原始点云（mid360 是 50 Hz）
    output_topic: "/livox/lidar_base"    # 给 NDT 用
    base_frame: "base_footprint"
    use_tf: true                         # 从 TF 取外参（云台转动也能跟上）
    tf_timeout: 0.05
    # use_tf: false 时用的固定外参 [x,y,z,roll,pitch,yaw]，单位 m / rad
    # 数值取自 fzsd2025 robot_description 生成出的 URDF：
    #   front_livox_joint: gimbal_yaw -> front_mid360, rpy -45° roll
    #   再叠 gimbal_yaw 相对 base_footprint 的固定偏移
    fallback_xyzrpy: [0.04541, 0.19059, 0.4936, -0.7854, 0.0, 0.0]
    max_rate: 0.0                        # 0=不限频；想省算力可设 20.0
